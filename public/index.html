<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111314">
  <title>篮场 · 美职篮盘口监控</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='20' fill='%23c8f06e'/%3E%3Ccircle cx='20' cy='20' r='10' fill='none' stroke='%23171a1c' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <main>
      <div class="page-toolbar">
        <span class="page-title">篮场</span>
        <div class="page-toolbar-actions"><span id="crown-session-label" role="status">皇冠会话未保存</span><button id="crown-login-open" class="button-primary" type="button">皇冠配置</button></div>
      </div>
      <section class="stats" aria-label="市场概况">
        <div class="stat"><span>监控比赛</span><strong id="stat-events">00</strong><small id="date-range">按所选时区筛选</small></div>
        <div class="stat"><span>市场盘口</span><strong id="stat-markets">00</strong><small>胜负 · 让分 · 大小分</small></div>
        <div class="stat"><span>当前买卖价差</span><strong id="stat-spread">—</strong><small>当前选中的结果</small></div>
        <div class="stat"><span>挂单总额</span><strong id="stat-depth">—</strong><small>当前结果 · 美元名义金额</small></div>
      </section>

      <div class="notice hidden" id="notice" role="status"></div>

      <div class="terminal-layout">
        <aside class="games-panel panel"><div class="panel-heading"><h2>比赛列表</h2><span class="mono" id="game-count">0 场比赛</span></div><div id="games" class="games-list"></div><div class="panel-footnote">时间按所选时区显示<br>赛程每分钟自动刷新</div></aside>

        <section class="market-panel panel"><div class="panel-heading"><h2>市场盘口</h2><a id="market-link" class="external-link hidden" target="_blank" rel="noopener noreferrer">查看市场 ↗</a></div><div id="match-heading" class="match-heading"></div><div id="markets" class="market-list" tabindex="0" role="region" aria-label="市场盘口内容，可上下滚动"></div></section>

        <section id="price-history" class="history-panel panel" aria-label="让分和大小分价格变动"></section>

        <section class="book-panel panel"><div class="panel-heading"><h2>订单簿</h2><span class="book-mode" id="book-mode">实时买卖挂单</span></div><div id="book-selection" class="book-selection"></div><div id="book-summary" class="book-summary"></div><div id="book" class="orderbook"></div><div class="panel-footnote book-footnote" id="book-footnote">选择一个市场结果以查看深度</div></section>
      </div>

      <footer><span><span class="footer-dot"></span> 只读监控 · 不提交订单</span><span>价格单位为美分 · 数量单位为份 · 每份结算价值最高 1 美元</span><span>数据来源：预测市场官方接口</span></footer>
    </main>
  </div>
  <dialog id="crown-login-dialog" class="crown-login-dialog" aria-labelledby="crown-login-title">
    <div class="login-dialog-heading"><h2 id="crown-login-title">皇冠账号配置</h2><button id="crown-login-close" class="button-quiet" type="button" aria-label="关闭">关闭</button></div>
    <p id="crown-login-status" class="login-status" role="status" aria-live="polite">正在读取本机会话状态</p>
    <div class="login-actions">
      <button id="crown-login-window-start" class="button-primary" type="button">打开皇冠登录窗口</button>
      <button id="crown-login-verify" type="button" disabled>验证并保存会话</button>
      <button id="crown-login-cancel" class="button-quiet" type="button" hidden>关闭登录窗口</button>
      <button id="crown-login-clear" class="button-danger" type="button" disabled>清除已保存会话</button>
    </div>
  </dialog>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/crown-login.js"></script>
</body>
</html>
